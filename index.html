<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดเครื่องพิมพ์ — Toner Low</title>
<style>
  /* ==========================================================
     แก้ URL ตรงนี้ให้เป็น Web app URL ของคุณเอง (บรรทัด src ของ iframe ด้านล่าง)
     ต้องเป็น URL ที่ลงท้ายด้วย /exec เท่านั้น
     ========================================================== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f6f4ee;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #6b6b63;
    font-size: 14px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e3ddd0;
    border-top-color: #12233d;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  iframe.loaded { opacity: 1; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>กำลังโหลดแดชบอร์ด...</div>
</div>

<!--
  ★★★ แก้ src ด้านล่างนี้เป็น Web app URL ของคุณเอง (ตัวที่ลงท้ายด้วย /exec) ★★★
  ตัวอย่าง: https://script.google.com/macros/s/AKfycby.../exec
-->
<iframe
  id="dashboardFrame"
  src="https://script.google.com/macros/s/AKfycbw9MtItkGMfCM4h_ApdmnDn6kMYtsvkR303FRLFUCDoOGMRa7XVrre4dfdx4B5N0iaq1g/exec
  allow="geolocation"
  onload="document.getElementById('loading').style.display='none'; this.classList.add('loaded');">
</iframe>

</body>
</html>
