<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ดเครื่องพิมพ์ — Toner Low</title>

<!-- ===== PWA: manifest + ไอคอน + theme color ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12233d">
<link rel="icon" href="icon-192.png" type="image/png">

<!-- รองรับ "Add to Home Screen" บน iOS โดยเฉพาะ (Safari ไม่อ่าน manifest.json เต็มรูปแบบ) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toner Dashboard">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  /* ==========================================================
     แก้ URL ตรงนี้ให้เป็น Web app URL ของคุณเอง (บรรทัด src ของ iframe ด้านล่าง)
     ต้องเป็น URL ที่ลงท้ายด้วย /exec เท่านั้น
     ========================================================== */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f6f4ee;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #6b6b63;
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #e3ddd0;
    border-top-color: #12233d;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  iframe.loaded { opacity: 1; }

  /* โผล่มาหลังรอนานผิดปกติ เผื่อเคส iframe โหลดหน้า login ของ Google ไม่ขึ้น (โดนบล็อกด้วย X-Frame-Options ของ Google เอง) */
  #fallback {
    display: none;
    margin-top: 4px;
  }
  #fallback a {
    color: #12233d;
    font-weight: 700;
    text-decoration: underline;
  }

  /* ปุ่มลอยมุมขวาล่าง ลิงก์ไปหน้าสรุปประโยชน์โครงการ (benefit.html)
     ตั้งใจวางไว้ "มุมล่าง" ไม่ใช่มุมบน เพราะแดชบอร์ดจริงข้างใน iframe ก็มีปุ่ม
     "Project Benefit" ของตัวเองอยู่มุมขวาบนอยู่แล้ว (ลิงก์ไปหน้า Apps Script คนละหน้ากัน)
     ถ้าวางซ้อนมุมเดียวกันจะกดสับสน/โดนปุ่มผิดได้ */
  #benefitLink {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #12233d;
    color: #fff;
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 24px;
    box-shadow: 0 4px 14px rgba(15,23,42,0.35);
    transition: background 0.15s, transform 0.15s;
  }
  #benefitLink:hover { background: #1e3a5f; transform: translateY(-1px); }
</style>
</head>
<body>
<a id="benefitLink" href="benefit.html" title="หน้าสรุปประโยชน์โครงการ (โฮสต์บน GitHub Pages)">📄 สรุปประโยชน์โครงการ</a>
<div id="loading">
  <div class="spinner"></div>
  <div>กำลังโหลดแดชบอร์ด...</div>
  <div id="fallback">
    โหลดนานผิดปกติ? อาจเป็นเพราะยังไม่ได้ล็อกอิน Google ในเบราว์เซอร์นี้<br>
    <a id="fallbackLink" href="#" target="_blank" rel="noopener">คลิกที่นี่เพื่อเปิดแดชบอร์ดโดยตรง</a>
  </div>
</div>
<!--
  ★★★ แก้ src ด้านล่างนี้เป็น Web app URL ของคุณเอง (ตัวที่ลงท้ายด้วย /exec) ★★★
  ตัวอย่าง: https://script.google.com/macros/s/AKfycby.../exec
-->
<iframe
  id="dashboardFrame"
  src="https://script.google.com/macros/s/AKfycbw3MeeKqx4TVISkf58IVbx7tcI26PZ4vY0UTkrIjBOY5Q-DibHQbdTSkXd4W4je53AqIQ/exec"
  allow="geolocation"
  onload="onDashboardFrameLoad()">
</iframe>

<script>
  const DASHBOARD_URL = document.getElementById('dashboardFrame').src;
  document.getElementById('fallbackLink').href = DASHBOARD_URL;

  let hasLoadedOnce = false;
  function onDashboardFrameLoad(){
    hasLoadedOnce = true;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboardFrame').classList.add('loaded');
  }

  // ถ้าผ่านไป 8 วินาทีแล้วยังไม่โหลดเสร็จ (onload ยังไม่ถูกเรียก) โชว์ลิงก์สำรองให้กดเปิดตรงแทน
  setTimeout(() => {
    if (!hasLoadedOnce) {
      document.getElementById('fallback').style.display = 'block';
    }
  }, 8000);

  // ลงทะเบียน Service Worker เพื่อให้ "Add to Home Screen" ติดตั้งเป็นแอปได้
  // (แคชเฉพาะเปลือกแอปหน้านี้ ไม่แตะข้อมูลข้างใน iframe — ดูรายละเอียดใน service-worker.js)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('ลงทะเบียน Service Worker ไม่สำเร็จ:', err);
      });
    });
  }
</script>
</body>
</html>
